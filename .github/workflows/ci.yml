name: ResilientPay Core Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-sdk:
    name: Rust Core SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/core
      - name: Run Cargo Tests & Test Vectors
        working-directory: sdk/core
        run: cargo test --all-targets --verbose

  go-backend:
    name: Go Reconciliation Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: Run Go Unit & Integration Tests
        working-directory: backend
        run: go test -race -v -count=1 ./...

  python-simulator:
    name: Research Simulator & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Simulator Dependencies
        working-directory: simulator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest cryptography cbor2
      - name: Run Simulator Tests
        working-directory: simulator
        run: pytest -v tests/
