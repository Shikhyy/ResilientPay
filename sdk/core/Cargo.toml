[package]
name = "resilientpay-core"
version = "0.1.0"
edition = "2021"
description = "ResilientPay SDK core: payment domain types, state machine, validation, serialization, and crypto boundary"
license = "Apache-2.0"
repository = "https://github.com/Shikhyy/ResilientPay"
rust-version = "1.70"

[lib]
name = "resilientpay_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
uuid = { version = "1.6", features = ["v4"] }
thiserror = "1.0"
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
hex = "0.4.3"
rand = "0.8"

[profile.release]
opt-level = "s"
strip = "symbols"
