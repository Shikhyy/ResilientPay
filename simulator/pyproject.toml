[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilientpay-sim"
version = "0.1.0"
description = "ResilientPay protocol simulator — research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5.6",          # CBOR encoding/decoding
    "cryptography>=42",    # Ed25519 signing/verification
    "attrs>=23",           # Immutable dataclasses with validators
    "cattrs>=23",          # attrs serialization
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:anchorpy suppresses a broken global plugin (anchorpy requires pytest_xprocess
# which is not installed in this environment).
addopts = "-v --tb=short -p no:anchorpy"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "N"]
ignore = ["E501"]   # long lines tolerated in data-heavy test vectors

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
