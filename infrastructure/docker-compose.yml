version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resilientpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resilientpay
      POSTGRES_PASSWORD: resilientpay_dev_secret
      POSTGRES_DB: resilientpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilientpay -d resilientpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: resilientpay-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESILIENTPAY_ADDR: ":8080"
      DATABASE_URL: "postgres://resilientpay:resilientpay_dev_secret@postgres:5432/resilientpay?sslmode=disable"
      RESILIENTPAY_ISSUER_SECRET: "dev_issuer_secret_key_32bytes_len"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
